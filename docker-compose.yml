services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
      notification-service:
        condition: service_started
    image: ai-portfolio-api:local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ai_portfolio
      CHECKPOINTER_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ai_portfolio
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports:
      - "127.0.0.1:8001:8000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-portfolio-frontend:local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: ai-portfolio-notifications:local
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-portfolio-postgres
    environment:
      POSTGRES_DB: ai_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ai_portfolio" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  init:
    image: ai-portfolio-api:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ai_portfolio
      CHECKPOINTER_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ai_portfolio
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - python -m alembic upgrade head && python -m src.scripts.index_knowledge
    restart: "no"

volumes:
  postgres_data: