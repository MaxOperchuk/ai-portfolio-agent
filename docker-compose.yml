services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-portfolio-postgres
    environment:
      POSTGRES_DB: ai_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: